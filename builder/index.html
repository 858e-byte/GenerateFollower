<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Follower Builder</title>
<style>
  :root {
    --bg: #15171c; --panel: #1d2027; --panel2: #252933; --line: #323744; --text: #e6e8ee; --dim: #9aa1b1;
    --accent: #6ea8ff; --ok: #4cc38a; --warn: #f0b44c; --err: #ef6b6b; --info: #8b93a7;
  }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: grid; grid-template-rows: auto 1fr; background: var(--bg); color: var(--text);
         font: 13px/1.45 "Segoe UI", system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .counts { color: var(--dim); }
  .counts b { color: var(--text); }
  header .spacer { flex: 1; }
  button { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; font: inherit; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #0b1220; font-weight: 600; }
  button.ok { background: var(--ok); border-color: var(--ok); color: #08130d; font-weight: 600; }
  button.bad { background: var(--err); border-color: var(--err); color: #1a0808; font-weight: 600; }
  button:disabled { opacity: .5; cursor: wait; }
  main { display: grid; grid-template-columns: 300px 1fr 420px; min-height: 0; }
  aside, section.right { background: var(--panel); min-height: 0; overflow: auto; }
  aside { border-right: 1px solid var(--line); display: flex; flex-direction: column; }
  section.right { border-left: 1px solid var(--line); padding: 14px 16px; }
  .filters { padding: 10px; display: grid; gap: 6px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); z-index: 1; }
  input, select, textarea { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font: inherit; width: 100%; }
  ul.list { list-style: none; margin: 0; padding: 0; }
  ul.list li { padding: 7px 12px; border-bottom: 1px solid #262a33; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; }
  ul.list li:hover { background: var(--panel2); }
  ul.list li.sel { background: #24344f; }
  ul.list .n { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  ul.list .s { grid-column: 1; color: var(--dim); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { font-size: 10px; padding: 1px 6px; border-radius: 9px; align-self: start; text-transform: uppercase; letter-spacing: .03em; }
  .b-valide { background: #173a2a; color: var(--ok); } .b-rejete { background: #3d1a1a; color: var(--err); }
  .b-avoir { background: #2a2f3b; color: var(--dim); } .b-exclu { background: #2a2f3b; color: #6b7285; }
  .center { position: relative; min-width: 0; min-height: 0; }
  #view { position: absolute; inset: 0; }
  .toolbar { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center;
             background: rgba(29,32,39,.88); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  .toolbar label { display: flex; gap: 5px; align-items: center; white-space: nowrap; }
  label.check { display: flex; gap: 6px; align-items: center; padding: 1px 0; } label.check input { width: auto; flex: none; margin: 0; }
  .toolbar select { width: 260px; }
  .status { position: absolute; bottom: 10px; left: 10px; color: var(--dim); background: rgba(29,32,39,.85); padding: 4px 8px; border-radius: 6px; }
  .empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--dim); }
  h2 { font-size: 15px; margin: 0 0 2px; } h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin: 18px 0 8px; }
  .meta { color: var(--dim); font-size: 12px; }
  .checks { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
  .checks li { padding: 6px 8px; border-radius: 6px; border-left: 3px solid; background: var(--panel2); }
  .c-ok { border-color: var(--ok); } .c-erreur { border-color: var(--err); } .c-attention { border-color: var(--warn); } .c-info { border-color: var(--info); color: var(--dim); }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  td, th { text-align: left; padding: 4px 6px; border-bottom: 1px solid #2a2f3a; vertical-align: top; }
  th { color: var(--dim); font-weight: 500; }
  td.x { padding-left: 20px; color: var(--dim); }
  .yes { color: var(--ok); } .no { color: var(--err); } .na { color: var(--dim); } .warn { color: var(--warn); }
  .verdict { margin: 8px 0 4px; padding: 8px 10px; border-radius: 6px; font-weight: 600; border-left: 4px solid; background: #1b2029; }
  .v-vert { border-color: var(--ok); } .v-orange { border-color: var(--warn); } .v-rouge { border-color: var(--err); } .v-export { border-color: #6ea8ff; }
  .advice { margin: 6px 0 10px; padding: 8px 10px; border-radius: 6px; background: #1b2029; border: 1px dashed #3a4150; font-size: 13px; }
  .repair { margin-top: 5px; font-size: 12px; } .repair code { font-size: 11px; } .repair button { margin-left: 6px; padding: 1px 8px; }
  .advice .hint { margin: 6px 0; padding: 6px 8px; border-radius: 4px; background: #1d2a3d; border-left: 3px solid #6ea8ff; }
  .advice ol { margin: 6px 0 4px; padding-left: 20px; } .advice li { margin: 2px 0; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; background: #3a4150; }
  .dot.vert { background: var(--ok); } .dot.orange { background: var(--warn); } .dot.rouge { background: var(--err); } .dot.export { background: #6ea8ff; }
  .tag { font-size: 10px; padding: 0 5px; border-radius: 4px; background: #2d3442; color: var(--dim); margin-left: 4px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .swatch { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; border: 1px solid #0006; }
  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 10px; max-width: 760px; width: 90vw; }
  .settings { display: grid; gap: 10px; margin-top: 10px; }
  .settings label { display: grid; gap: 3px; font-weight: 600; }
  .settings .used { font-weight: 400; font-size: 11px; color: var(--dim); word-break: break-all; }
  .settings .used.bad { color: var(--err); }
  dialog pre { white-space: pre-wrap; max-height: 50vh; overflow: auto; background: var(--bg); padding: 10px; border-radius: 6px; font-size: 11px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "./vendor/three-0.160.0/three.module.js",
  "three/addons/": "./vendor/three-0.160.0/addons/"
} }
</script>
</head>
<body>
<header>
  <h1>Follower Builder <span class="meta" id="version"></span></h1>
  <span class="counts" id="counts"></span>
  <span class="spacer"></span>
  <button id="settings" title="Dossier du jeu, gestionnaire de mods, archives, outils (7-Zip, texconv, Python, PyNifly)">Réglages</button>
  <button id="rescan" title="Relit les presets (.jslot) et les exports (Export Head) de CharGen : nouveaux presets, nouveaux exports">Rescanner</button>
  <button class="primary" id="build" title="Un plugin GF_<nom>.esp avec tous les followers validés">Construire un pack des validés</button>
</header>
<main>
  <aside>
    <div class="filters">
      <input id="q" placeholder="Rechercher un preset…">
      <select id="fstat">
        <option value="">Tous les statuts</option><option value="avoir">À voir</option>
        <option value="valide">Validés</option><option value="rejete">Rejetés</option><option value="exclu">Exclus du CSV</option>
      </select>
      <select id="fcat"><option value="">Toutes les catégories</option></select>
      <select id="fver" title="Verdict « prêt pour le jeu » (calculé à l'ouverture de la fiche, ou avec « Tout vérifier »)">
        <option value="">Tous les verdicts</option><option value="vert">Prêts pour le jeu</option>
        <option value="orange">À corriger (défauts visibles)</option><option value="rouge">Pièce manquante (tête rejetée)</option>
        <option value="export">Sans export (à construire dans RaceMenu)</option>
        <option value="aucun">Pas encore vérifiés</option>
      </select>
      <button id="verifyAll" title="Calcule le verdict de chaque preset de la liste affichée (filtres compris)">Tout vérifier</button>
    </div>
    <ul class="list" id="list"></ul>
  </aside>
  <div class="center">
    <div id="view"></div>
    <div class="empty" id="empty">Choisis un preset dans la liste.</div>
    <div class="toolbar">
      <label><input type="checkbox" id="tHead" checked> Tête générée</label>
      <label><input type="checkbox" id="tHair" checked> Cheveux et accessoires</label>
      <label><input type="checkbox" id="tTex" checked> Textures</label>
      <label><input type="checkbox" id="tBase"> Tête de base (fil de fer)</label>
      <label title="Maquillages, tatouages et peintures du visage du preset (RaceMenu), dessinés sur la tête"><input type="checkbox" id="tOvl" checked> Overlays du visage</label>
      <label>Référence <select id="ref"><option value="">aucune</option></select></label>
      <label>Comparaison <select id="mode" style="width:auto">
        <option value="side">Côte à côte</option><option value="overlay">Superposition</option><option value="flip">Alterner (Espace)</option>
      </select></label>
      <label><input type="checkbox" id="tRefHair"> Cheveux de la référence</label>
      <button id="flip" hidden>Afficher la référence</button>
      <button id="recenter">Recentrer</button>
    </div>
    <div class="status" id="status"></div>
  </div>
  <section class="right" id="detail"><p class="meta">Aucun preset sélectionné.</p></section>
</main>
<dialog id="dlg"><h2 id="dlgTitle"></h2><pre id="dlgBody"></pre><form method="dialog"><button>Fermer</button></form></dialog>
<dialog id="dlgSettings"><h2>Réglages</h2>
  <p class="meta">Champ vide = valeur détectée (affichée en dessous). Fichier : <code id="setFile"></code></p>
  <p class="meta" id="setInstall" style="white-space: pre-line"></p>
  <div class="settings" id="setFields"></div>
  <div class="actions"><button class="primary" id="setSave">Enregistrer</button><button id="setClose">Fermer</button>
    <span class="spacer" style="flex:1"></span>
    <button id="diag" title="Crée un ZIP (installation, outils, presets, dernières erreurs) à joindre à un retour de bêta. Rien n'est envoyé.">Rapport de diagnostic</button></div>
</dialog>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const $ = id => document.getElementById(id);
const api = async (url, opt) => { const r = await fetch(url, opt); const j = await r.json(); if (!r.ok) throw new Error(j.erreur || r.status); return j; };

// ---------- traduction (builder\i18n\<langue>.json : { texte français : traduction }) ----------
// T(texte français avec {0}, valeur…) ; texte absent du fichier = français
const I18N = await fetch('/api/i18n').then(r => r.json()).catch(() => ({ lang: 'fr', textes: {} }));
const T = (fr, ...a) => (I18N.textes[fr] || fr).replace(/\{(\d+)\}/g, (_, i) => a[i] ?? '');
// textes fixes de la page : nœuds de texte et attributs title / placeholder dont le texte est dans le dictionnaire
function translatePage() {
  document.documentElement.lang = I18N.lang;
  if (I18N.lang === 'fr') return;
  const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
  for (let n; (n = walker.nextNode());) {
    const key = n.nodeValue.trim();
    if (key && I18N.textes[key]) n.nodeValue = n.nodeValue.replace(key, I18N.textes[key]);
  }
  document.querySelectorAll('[title],[placeholder]').forEach(el => ['title', 'placeholder'].forEach(a => {
    const v = el.getAttribute(a); if (v && I18N.textes[v]) el.setAttribute(a, I18N.textes[v]);
  }));
}
translatePage();
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let presets = [], current = null, info = null;

// ---------- liste ----------
const statusOf = p => !p.inclure ? 'exclu' : (p.validation?.status || 'avoir');
const statusLabel = { avoir: T('à voir'), valide: T('validé'), rejete: T('rejeté'), exclu: T('exclu') };

async function loadList() {
  presets = await api('/api/presets');
  const cats = [...new Set(presets.map(p => p.categorie))].sort();
  $('fcat').innerHTML = `<option value="">${T('Toutes les catégories')}</option>` + cats.map(c => `<option>${esc(c)}</option>`).join('');
  renderList();
}
function renderList() {
  const q = $('q').value.toLowerCase(), fs = $('fstat').value, fc = $('fcat').value, fv = $('fver').value;
  const vOf = p => p.verdict?.niveau ?? 'aucun';
  const n = { valide: 0, rejete: 0, avoir: 0 };
  presets.forEach(p => { const s = statusOf(p); if (s in n) n[s]++; });
  $('counts').innerHTML = T('<b>{0}</b> validés · <b>{1}</b> rejetés · <b>{2}</b> à voir', n.valide, n.rejete, n.avoir);
  $('list').innerHTML = presets
    .filter(p => (!q || (p.nom + ' ' + p.preset).toLowerCase().includes(q)) && (!fs || statusOf(p) === fs) && (!fc || p.categorie === fc)
      && (!fv || vOf(p) === fv))
    .map(p => `<li data-id="${p.id}" class="${p.id === current ? 'sel' : ''}">
        <span class="n"><span class="dot ${vOf(p)}" title="${esc(T(p.verdict?.texte ?? 'Pas encore vérifié'))}"></span>${esc(p.nom)}${p.nom !== p.nomPreset
          ? ` <span class="meta" title="${T('Nom du preset (fichier .jslot), qui ne change pas')}">· preset ${esc(p.nomPreset)}</span>` : ''}</span><span class="badge b-${statusOf(p)}">${statusLabel[statusOf(p)]}</span>
        <span class="s">${esc(p.categorie)} · ${esc(p.race)}${p.tete ? '' : ' · ' + T('pas de tête')}</span></li>`).join('');
}
$('list').onclick = e => { const li = e.target.closest('li'); if (li) select(li.dataset.id); };
['q', 'fstat', 'fcat', 'fver'].forEach(id => $(id).oninput = renderList);
// « Tout vérifier » : analyse chaque preset de la liste filtrée (le serveur mémorise les verdicts)
$('verifyAll').onclick = async () => {
  const b = $('verifyAll'), todo = [...$('list').querySelectorAll('li')].map(li => li.dataset.id);
  if (!todo.length || !confirm(T('Vérifier {0} preset(s) ? (quelques secondes chacun)', todo.length))) return;
  b.disabled = true;
  for (let i = 0; i < todo.length; i++) {
    b.textContent = T('Vérification {0}/{1}…', i + 1, todo.length);
    try { const r = await api('/api/preset/' + todo[i]); const p = presets.find(x => x.id === todo[i]); if (p) p.verdict = r.verdict; } catch {}
    if (i % 5 === 4) renderList();
  }
  renderList(); b.disabled = false; b.textContent = T('Tout vérifier');
};

// ---------- détail ----------
async function select(id) {
  current = id; renderList();
  $('detail').innerHTML = `<p class="meta">${T('Analyse en cours…')}</p>`;
  try { info = await api('/api/preset/' + id); } catch (e) { $('detail').innerHTML = `<p class="no">${esc(e.message)}</p>`; return; }
  skinInfo = await api('/api/skins/' + id).catch(e => ({ erreur: e.message, skins: [] }));
  combatInfo = await api('/api/combat/' + id).catch(e => ({ erreur: e.message, styles: [], classes: [] }));
  voiceInfo = await api('/api/voice/' + id).catch(e => ({ erreur: e.message, voixListe: [] }));
  optionsInfo = await api('/api/options/' + id).catch(e => ({ erreur: e.message, choix: {}, tenues: [] }));
  await loadCoherence();
  updateSkinHead();
  const lp = presets.find(x => x.id === id); if (lp && info.verdict) { lp.verdict = info.verdict; renderList(); }
  renderDetail();
  loadHead();
}
function partRow(p, extra) {
  const yes = `<span class="yes">${T('oui')}</span>`, no = `<span class="no">${T('non')}</span>`;
  const race = p.raceOk === null ? '<span class="na">—</span>' : p.raceOk ? yes : no;
  const sex = p.sexeOk ? yes : no;
  const tag = (p.origine === 'défaut de la race' ? `<span class="tag">${T('défaut race')}</span>` : '')
    + (p.recree ? `<span class="tag" title="${T('recréé dans GenerateFollower.esp ({0})', esc(p.plugin))}">${T('recréé')}</span>` : '');
  let html = `<tr><td class="${extra ? 'x' : ''}">${esc(p.edid)}${tag}</td><td>${esc(p.type)}</td><td>${p.modele ? T('oui') : `<span class="na">${T('non')}</span>`}</td>
    <td title="${esc(p.listeRaces)}">${race}</td><td>${sex}</td></tr>`;
  for (const x of p.extras) html += partRow(x, true);
  return html;
}
// Marche à suivre quand le preset pose problème (verdict orange ou rouge, exclu, mods manquants) : reconstruire la tête
// dans RaceMenu avec les mods installés, puis refaire l'export (méthode validée : Psynwen, thorRg, UBE Aria Black)
function fixAdvice() {
  const p = presets.find(x => x.id === current);
  const name = info.preset.split('\\').pop();
  const lvl = info.verdict?.niveau;
  const problem = lvl === 'rouge' || lvl === 'orange' || lvl === 'export'
    || p?.inclure === false || /MODS_MANQUANTS|SANS_VISAGE|PARTIEL/.test(info.statut ?? '');
  if (!problem) return '';
  const hint = lvl === 'export'
    ? `<p class="hint">💡 ${T('Astuce : dans RaceMenu, une fois le preset chargé, utilise « Export Head » pour sauvegarder (exporter) la tête, en lui donnant <b>exactement le même nom que ton preset</b> : « {0} ». Le Builder la retrouve alors tout seul.', esc(name))}</p>`
    : '';
  return `<div class="advice"><b>${lvl === 'export' ? T('Comment construire la tête de ce preset') : T('Comment corriger ce preset')}</b>${hint}
    <ol>
      <li>${T('Dans RaceMenu, charge le preset « {0} ».', esc(name))}</li>
      <li>${T('Si le visage est déformé, utilise « Import Head » avec le .nif fourni avec le preset.')}</li>
      <li>${T('Remplace les pièces qui manquent ou s\'affichent mal (yeux, sourcils, cheveux, bouche…) par des pièces installées chez toi : le preset sera alors reconstruit avec tes propres mods.')}</li>
      <li>${T('Sauvegarde le preset sous le même nom, puis fais « Export Head » sous le nom exact « {0} ».', esc(name))}</li>
      <li>${T('Reviens ici et clique « Rescanner » : la fiche est revérifiée avec ton nouvel export.')}</li>
    </ol>
    <span class="meta">${T('Le follower reprend exactement ce que RaceMenu affiche chez toi au moment de l\'export.')}</span></div>`;
}
// ---------- peau (skin) ----------
// Skins compatibles avec le corps du follower (UBE, CBBE/3BA, HIMBO), trouvés dans les mods Vortex (activés ou non) et
// les archives téléchargées. Le skin choisi est copié dans le mod du follower au build (taille d'origine).
let skinInfo = { skins: [] }, skinHead = null;
const skinTex = (id, role) => `/api/skin-texture?skin=${encodeURIComponent(id)}&role=${role}`;
function updateSkinHead() {
  const s = skinInfo.skins.find(x => x.id === skinInfo.choix);
  skinHead = s && s.roles.includes('head_d') ? skinTex(s.id, 'head_d') : null;
}
function skinSection() {
  if (skinInfo.erreur) return `<h3>${T('Peau (skin)')}</h3><p class="no">${esc(skinInfo.erreur)}</p>`;
  const s = skinInfo.skins.find(x => x.id === skinInfo.choix);
  const opt = x => `<option value="${esc(x.id)}" ${x.id === skinInfo.choix ? 'selected' : ''}>${esc(x.nom)} (${x.source}, ${T('{0} Mo', x.mo)})</option>`;
  const thumb = (role, label) => s && s.roles.includes(role)
    ? `<figure style="margin:0;text-align:center"><img src="${skinTex(s.id, role)}" alt="${label}" loading="lazy"
         style="width:150px;height:150px;object-fit:cover;border-radius:6px;background:#222"><figcaption class="meta">${label}</figcaption></figure>` : '';
  return `<h3>${T('Peau (skin)')}</h3>
    <div class="meta">${T('Corps du follower : <b>{0}</b> ({1}) · {2} skin(s) compatible(s)', esc(skinInfo.corps), esc(skinInfo.sexe), skinInfo.skins.length)}</div>
    <div class="actions"><select id="skin" style="flex:1">
      <option value="">${T('Peau du jeu (par défaut)')}</option>${skinInfo.skins.map(opt).join('')}</select>
      <button id="skinsRefresh" title="${T('Après avoir installé un skin dans ton gestionnaire de mods ou téléchargé une archive')}">${T('Chercher les skins')}</button></div>
    ${skinInfo.choixInconnu ? `<p class="no">${T('Le skin choisi n\'est plus trouvé (mod ou archive déplacé) : peau du jeu au build.')}</p>` : ''}
    ${s ? `<div style="display:flex;gap:10px;margin:6px 0">${thumb('body_d', T('corps'))}${thumb('head_d', T('visage'))}</div>
      <p class="meta">${esc(s.chemin)}<br>${s.roles.includes('head_d')
        ? T('Textures : {0}. Corps, mains, pieds et visage : copiés dans le mod du follower au build, sans réduction. Les autres PNJ et le joueur ne changent pas.', s.roles.join(', '))
        : T('Textures : {0}. Corps, mains, pieds : copiés dans le mod du follower au build, sans réduction. Les autres PNJ et le joueur ne changent pas.', s.roles.join(', '))}</p>` : ''}`;
}
function bindSkin() {
  if (!$('skin')) return;
  $('skin').onchange = async () => {
    try { await api('/api/skin/' + current, { method: 'POST', body: JSON.stringify({ skin: $('skin').value || null }) }); }
    catch (e) { dialog(T('Erreur'), e.message); }
    skinInfo = await api('/api/skins/' + current);
    updateSkinHead(); renderDetail();
    if (lastMesh) buildGroup(groups.head, lastMesh, 'solid');
  };
  $('skinsRefresh').onclick = async () => {
    const b = $('skinsRefresh'); b.disabled = true; b.textContent = T('Recherche…');
    try { const r = await api('/api/skins-refresh', { method: 'POST' }); skinInfo = await api('/api/skins/' + current); renderDetail(); dialog('Skins', T('{0} skins trouvés (tous corps confondus).', r.total)); }

let voiceAudio = null;
function bindVoice() {
  if (!$('voice')) return;
  $('voicePlay').onclick = async () => {
    const id = $('voice').value || voiceInfo.defaut, b = $('voicePlay');
    b.disabled = true;
    try {
      const r = await fetch('/api/voice-sample?voix=' + encodeURIComponent(id));
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).erreur || r.status);
      if (voiceAudio) { voiceAudio.pause(); URL.revokeObjectURL(voiceAudio.src); }
      voiceAudio = new Audio(URL.createObjectURL(await r.blob()));
      await voiceAudio.play();
    } catch (e) { dialog(T('Écouter'), T('Écoute impossible : {0}', e.message)); }
    finally { b.disabled = false; }
  };

    try { voiceInfo = await api('/api/voice/' + current, { method: 'POST', body: JSON.stringify({ voix: $('voice').value || null }) }); }

  };
}

const renderer = new THREE.WebGLRenderer({ antialias: true });

function resize() { const r = $('view').getBoundingClientRect(); renderer.setSize(r.width, r.height); camera.aspect = r.width / r.height; camera.updateProjectionMatrix(); }

const isFace = s => s.shader === 4;
// NiAlphaProperty : facteurs de mélange du jeu -> three.js
const BLEND = [THREE.OneFactor, THREE.ZeroFactor, THREE.SrcColorFactor, THREE.OneMinusSrcColorFactor, THREE.DstColorFactor,

  THREE.OneMinusDstAlphaFactor, THREE.SrcAlphaSaturateFactor];
// Formes invisibles en jeu : volumes de collision SMP (Virtual*, _BDO_col*) et lentilles factices, sans texture ;
// collisions des coiffures [dint999] (_HP2colHead, _HP2colWig…), texturées avec la texture transparente 0alfa.dds :
// dessinées, elles couvraient le visage d'une coque noire (UBE Aria Black)
const isHelper = s => !s.diffuse || /(^|\\)0alfa\.dds$/i.test(s.diffuse);
// Texture du jeu (convertie en PNG par le serveur). Introuvable : la forme passe en violet, comme en jeu.
const MISSING = 0xff00ff;
function loadTex(url, srgb, mat) {
  const hit = texCache[url];
  if (hit === 'missing') { if (mat) { mat.color.set(MISSING); missingCount++; } return null; }
  if (hit) return hit;
  return texCache[url] = texLoader.load(url, t => { if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.flipY = false; }, undefined, () => {
    texCache[url] = 'missing';
    if (mat) { mat.map = null; mat.color.set(MISSING); mat.needsUpdate = true; missingCount++; showMissing(); }
  });
}
let missingCount = 0;
function showMissing() {
  if (missingCount) $('status').textContent = T('{0} texture(s) introuvable(s), en violet (comme en jeu) : voir les vérifications', missingCount);
}
// Forme qui reçoit la teinte FaceGen : la tête (shader FaceGen avec teinte, la plus grande ; pas la bouche)
function tintTarget(data) {
  return data.shapes.filter(s => isFace(s) && s.tint).sort((a, b) => b.verts.length - a.verts.length)[0];
}
// Shader FaceGen du jeu : couleur = b² + 2·t·b·(1−b) (b diffuse, t teinte ; t = 0,5 laisse la diffuse telle
// quelle), calculé en espace sRGB comme dans le jeu
function applyFaceTint(mat, tint) {
  if (!tint) return;
  mat.onBeforeCompile = sh => {
    sh.uniforms.tintMap = { value: tint };
    sh.fragmentShader = 'uniform sampler2D tintMap;\n' + sh.fragmentShader.replace('#include <map_fragment>', `#include <map_fragment>
      vec3 gfB = pow(max(diffuseColor.rgb, 0.0), vec3(1.0 / 2.2));
      vec3 gfT = texture2D(tintMap, vMapUv).rgb;
      diffuseColor.rgb = pow(gfB * gfB + 2.0 * gfT * gfB * (1.0 - gfB), vec3(2.2));`);
  };
  // clé propre au matériau : avec une clé commune, three.js réutilise le programme du premier matériau sans appeler
  // onBeforeCompile, et le second (tête ou référence) n'a pas sa texture de teinte
  mat.customProgramCacheKey = () => 'gf-facetint-' + mat.uuid;
}
// Overlays du visage (RaceMenu) : comme le jeu, une copie de la géométrie de la tête par overlay, dessinée par-dessus
// la peau (décalage de profondeur), texture × couleur, opacité = alpha de la texture × alpha du preset
let lastOvl = [];
function addFaceOverlays(group, data) {
  const head = tintTarget(data) ?? data.shapes.filter(isFace).sort((a, b) => b.verts.length - a.verts.length)[0];
  const base = head && group.children.find(m => m.userData.name === head.name);
  if (!base) return;
  lastOvl.forEach((l, i) => {
    const mat = new THREE.MeshStandardMaterial({ roughness: .7, transparent: true, opacity: l.alpha, depthWrite: false,
      polygonOffset: true, polygonOffsetFactor: -2 - i, polygonOffsetUnits: -2 - i, side: THREE.FrontSide,
      color: l.color == null ? 0xffffff : l.color });
    mat.map = loadTex('/api/texture?path=' + encodeURIComponent(l.tex), true, mat);
    const m = new THREE.Mesh(base.geometry, mat);
    m.userData = { face: true, ovl: true, name: l.node };
    m.renderOrder = 2 + i;

function buildGroup(group, data, mode) {
  group.clear();
  for (const s of data.shapes) {
    if (isHelper(s)) continue;
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(s.verts, 3));
    if (s.uvs.length) g.setAttribute('uv', new THREE.Float32BufferAttribute(s.uvs, 2));
    g.setIndex(s.tris); g.computeVertexNormals();
    let mat;
    if (mode === 'wire') mat = new THREE.MeshBasicMaterial({ color: group === groups.base ? 0x6ea8ff : 0xf0b44c, wireframe: true, transparent: true, opacity: .35 });
    else {

      // seuil ; sans propriété de transparence, la forme est opaque (ex. l'œil LDD)
      // Facteurs de mélange du NIF (ex. couche additive SRC_ALPHA + ONE des yeux LDD : un noir n'ajoute rien)
      const blend = s.alphaBlend ?? s.alpha;

        mat.blendDst = BLEND[s.blendDst] ?? THREE.OneMinusSrcAlphaFactor;
      }
      if ($('tTex').checked && s.diffuse) {

        const skinFace = group === groups.head && skinHead && s === tintTarget(data);
        mat.map = loadTex(skinFace ? skinHead : '/api/texture?path=' + encodeURIComponent(s.diffuse), true, mat);
        if (s === tintTarget(data) && s.tint) applyFaceTint(mat, loadTex(group === groups.head
          ? `/api/tint/${current}?path=${encodeURIComponent(s.tint)}` : '/api/texture?path=' + encodeURIComponent(s.tint), false, null));
      }
    }
    // les yeux font partie du visage : ils restent affichés quand on masque cheveux et accessoires
    const eye = s.shader === 16 || (/eye/i.test(s.name) && !/lash|brow/i.test(s.name));
    const m = new THREE.Mesh(g, mat); m.userData = { face: isFace(s) || eye, name: s.name };

  groups.base.visible = $('tBase').checked && !(flipping && showRef);
  groups.ref.visible = !flipping || showRef;
  groups.ref.children.forEach(m => m.visible = m.userData.face || $('tRefHair').checked);
  $('flip').hidden = !flipping;
  $('flip').textContent = showRef ? T('Afficher notre tête') : T('Afficher la référence');
  if (flipping) $('status').textContent = showRef ? T('Référence RaceMenu affichée (Espace pour basculer)') : T('Notre tête affichée (Espace pour basculer)');
}
function placeRef() {
  if (!lastRef) return;
  const mode = $('mode').value;
  buildGroup(groups.ref, lastRef, mode === 'overlay' ? 'wire' : 'solid');
  // côte à côte : décalée d'une largeur et demie de tête vers la droite de l'écran (-X vu de face)
  const box = new THREE.Box3();
  groups.head.children.filter(m => m.userData.face).forEach(m => box.expandByObject(m));
  const w = box.isEmpty() ? 20 : box.getSize(new THREE.Vector3()).x;
  groups.ref.position.x = mode === 'side' ? -w * 1.5 : 0;
  applyVisibility(); frame();
}
function frame() {
  scene.updateMatrixWorld(true);   // la position de la référence (côte à côte) doit être prise en compte
  const box = new THREE.Box3();
  groups.head.children.filter(m => m.userData.face).forEach(m => box.expandByObject(m));
  if ($('mode').value === 'side') groups.ref.children.filter(m => m.userData.face).forEach(m => box.expandByObject(m));
  if (box.isEmpty()) box.setFromObject(groups.head);
  if (box.isEmpty()) return;
  const c = box.getCenter(new THREE.Vector3()), size = box.getSize(new THREE.Vector3()).length();
  controls.target.copy(c);
  // les têtes Skyrim regardent vers +Y
  camera.position.set(c.x + size * .35, c.y + size * 2.6, c.z + size * .2);
  controls.update();
}
let lastMesh = null;
async function loadHead() {
  $('empty').style.display = 'none';
  const p = presets.find(x => x.id === current);
  groups.head.clear(); groups.base.clear(); groups.ref.clear(); $('ref').value = ''; lastRef = null; showRef = false;
  // propose l'export RaceMenu du même nom s'il existe
  // (pas les fichiers de « Head Sculpts » : ce sont des sculpts, pas des exports complets de la tête)
  // d'abord l'export associé (le visage en jeu), sinon l'export au nom du preset (jamais le nom en jeu, qui peut avoir
  // été changé dans le Builder)
  const imp = (info.import?.path ?? '').toLowerCase();
  const guess = [...$('ref').options].find(o => o.value && imp && o.value.toLowerCase().endsWith('\\' + imp))
    ?? [...$('ref').options].find(o => o.value && !/\\head sculpts\\/i.test(o.value)
      && o.value.toLowerCase().endsWith('\\' + info.nomPreset.toLowerCase() + '.nif'));
  // l'export RaceMenu suffit pour l'aperçu (c'est lui le visage en jeu), même sans tête générée hors jeu
  if (!p.tete && !info.import?.path) { $('status').textContent = T('Ni export RaceMenu ni tête générée.'); return; }
  $('status').textContent = T('Chargement de la tête…');
  lastMesh = await api('/api/mesh/' + current);
  lastOvl = await api('/api/faceoverlays/' + current).catch(() => []);
  missingCount = 0;
  $('status').textContent = T('{0} formes · glisser pour tourner, molette pour zoomer', lastMesh.shapes.length);
  buildGroup(groups.head, lastMesh, 'solid'); frame(); showMissing();
  const face = info.headparts.find(h => h.type === 'Face' && h.modele);
  if (face) api('/api/mesh-file?path=' + encodeURIComponent(face.modele)).then(d => buildGroup(groups.base, d, 'wire')).catch(() => {});
  if (guess) { $('ref').value = guess.value; loadRef(); }
}
async function loadRef() {
  groups.ref.clear(); lastRef = null; showRef = false; applyVisibility(); frame();
  const path = $('ref').value; if (!path) return;
  $('status').textContent = T('Chargement de la référence…');
  try {
    lastRef = await api('/api/mesh-file?path=' + encodeURIComponent(path));
    placeRef();
    // l'écart se calcule contre la tête générée hors jeu : sans elle (export seul), pas de mesure
    const d = await api(`/api/compare/${current}?path=${encodeURIComponent(path)}`).catch(() => ({ erreur: T("pas d'écart mesuré (pas de tête générée)") }));
    const where = $('mode').value === 'side' ? T('à droite') : $('mode').value === 'overlay' ? T('en orange') : T('touche Espace');
    $('status').textContent = T('Référence ({0}) : {1}', where, path.split('\\').slice(-2).join('\\')) + ' · '
      + (d.erreur ? d.erreur : T('écart du visage : moyen {0} · 95 % sous {1} · max {2} (< 0,1 ≈ identique)', d.moyen, d.p95, d.max));
  } catch (e) { $('status').textContent = e.message; }
}
function flip() { if ($('mode').value === 'flip' && lastRef) { showRef = !showRef; applyVisibility(); } }
['tHead', 'tHair', 'tBase', 'tRefHair', 'tOvl'].forEach(id => $(id).onchange = applyVisibility);
$('tTex').onchange = () => { lastMesh && buildGroup(groups.head, lastMesh, 'solid'); placeRef(); };
$('ref').onchange = loadRef;
$('mode').onchange = () => { showRef = false; placeRef(); };
$('flip').onclick = flip;
addEventListener('keydown', e => { if (e.code === 'Space' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); flip(); } });
$('recenter').onclick = frame;
api('/api/references').then(r => $('ref').innerHTML = `<option value="">${T('aucune')}</option>` + r.map(f => `<option>${esc(f)}</option>`).join(''));

loadList();
</script>
